name: jyj

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m

  backend:
    build:
      context: ./backend
      target: runtime
    image: jyj-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CODEX_HOME: /var/lib/codex
      PHOTOS_DIR: /var/lib/jyj/photos
    volumes:
      - photos:/var/lib/jyj/photos
      - codex-home:/var/lib/codex
      - whisper-models:/var/lib/jyj/whisper
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m

  web:
    build:
      context: ./frontend
      target: web
      additional_contexts:
        deploy: ./deploy
    image: jyj-web
    restart: unless-stopped
    environment:
      JYJ_HOSTNAME: ${JYJ_HOSTNAME:-recipes.home.arpa}
      JYJ_LAN_IP: ${JYJ_LAN_IP:-}
      JYJ_TLS: ${JYJ_TLS:-internal}
      JYJ_DNS_PROVIDER: ${JYJ_DNS_PROVIDER:-}
      JYJ_DNS_API_TOKEN: ${JYJ_DNS_API_TOKEN:-}
    ports:
      - "${WEB_BIND:-0.0.0.0}:80:80"
      - "${WEB_BIND:-0.0.0.0}:443:443"
    volumes:
      - photos:/srv/media:ro
      # /data holds Caddy's internal root CA; losing it means reinstalling the CA on every device.
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost/"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m

  db-test:
    image: postgres:16-alpine
    profiles: [test]
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: jyj
      POSTGRES_PASSWORD: jyj
      POSTGRES_DB: jyj_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jyj -d jyj_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    mem_limit: 256m

volumes:
  pgdata:
  photos:
  codex-home:
  whisper-models:
  caddy-data:
  caddy-config:
